; Project-local PHP overrides for the dashboard's image uploads.
; Picked up automatically when artisan serve is run via the
; composer "dev" script (see composer.json), which sets
; PHP_INI_SCAN_DIR to this directory.

upload_max_filesize = 32M
post_max_size       = 64M
memory_limit        = 256M
max_file_uploads    = 40
